version: 2

models:
  - name: dim_customers
    columns:
      - name: CUSTOMER_ID
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    columns:
      - name: ORDER_ID
        data_tests:
          - unique
          - not_null
      - name: CUSTOMER_ID
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: CUSTOMER_ID

  - name: dim_products
    columns:
      - name: PRODUCT_ID
        data_tests:
          - unique
          - not_null

  - name: fct_inventory
    columns:
      - name: INVENTORY_ID
        data_tests:
          - unique
          - not_null
      - name: PRODUCT_ID
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: PRODUCT_ID